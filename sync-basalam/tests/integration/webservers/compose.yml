name: sync-basalam-webservers

x-runtime: &runtime
  environment: &environment
    MATRIX_TOKEN: ${MATRIX_TOKEN:?Run through run.py}
    MATRIX_SITE_URL: http://apache
  volumes: &volumes
    - ${MATRIX_SITE_DIR:?Supply a disposable WordPress directory}:/var/www/html
    - ../../..:/var/www/html/wp-content/plugins/sync-basalam:ro
    - ./wp-config.php:/var/www/html/wp-config.php:ro
    - ./fixture.php:/var/www/html/wp-content/mu-plugins/matrix.php:ro
    - .:/matrix:ro
  networks: [matrix]

services:
  db:
    image: mariadb:11.4@sha256:67873d30a17f6a9c331f06363b2fa15f38abca415529966d67c84f87f82439fe
    environment:
      MARIADB_ROOT_PASSWORD: local-matrix-only
      MARIADB_DATABASE: wordpress
    networks: [matrix]
    volumes:
      - database:/var/lib/mysql
    healthcheck:
      test: [CMD, healthcheck.sh, --connect, --innodb_initialized]
      interval: 2s
      timeout: 2s
      retries: 30
  apache:
    <<: *runtime
    image: wordpress:php8.2-apache@sha256:155d6534e01341dccfda59cdc2d44b016009768100cf0c67b8e3f991d1b53d36
    ports: ["127.0.0.1:8141:80"]
  fpm:
    <<: *runtime
    image: wordpress:php8.2-fpm@sha256:6fcaca608dd4c2acb910e32cf415d96dddbd52de7b53a4eae16287f52b933309
    environment:
      <<: *environment
      MATRIX_SITE_URL: http://nginx
  nginx:
    image: nginx:1.29-alpine@sha256:5616878291a2eed594aee8db4dade5878cf7edcb475e59193904b198d9b830de
    networks: [matrix]
    volumes:
      - ${MATRIX_SITE_DIR}:/var/www/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    ports: ["127.0.0.1:8142:80"]
  caddy-fpm:
    <<: *runtime
    image: wordpress:php8.2-fpm@sha256:6fcaca608dd4c2acb910e32cf415d96dddbd52de7b53a4eae16287f52b933309
    environment:
      <<: *environment
      MATRIX_SITE_URL: http://caddy
  caddy:
    image: caddy:2-alpine@sha256:d8542f48d34a9cf4e4c11a478865229840e87e4c96ea3f439101f31a5d35f75f
    networks: [matrix]
    volumes:
      - ${MATRIX_SITE_DIR}:/var/www/html:ro
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
    ports: ["127.0.0.1:8143:80"]
  ols:
    <<: *runtime
    image: litespeedtech/openlitespeed:1.9.3-lsphp83@sha256:bb1f29d6052d86cf72b28f33dbd1bb14137a1d3f4449da245a4e7a3f53778aec
    entrypoint: [/bin/sh, /matrix/ols-entrypoint.sh]
    environment:
      <<: *environment
      MATRIX_SITE_URL: http://ols:8088
    volumes:
      - ${MATRIX_SITE_DIR}:/var/www/html
      - ../../..:/var/www/html/wp-content/plugins/sync-basalam:ro
      - ./wp-config.php:/var/www/html/wp-config.php:ro
      - ./fixture.php:/var/www/html/wp-content/mu-plugins/matrix.php:ro
      - .:/matrix:ro
    ports: ["127.0.0.1:8144:8088"]

networks:
  matrix: {}
volumes:
  database:
