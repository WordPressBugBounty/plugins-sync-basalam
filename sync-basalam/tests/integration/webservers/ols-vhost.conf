docRoot                   /var/www/html/
vhDomain                  ols
enableGzip                0
index {
  useServer               0
  indexFiles              index.php, index.html
}
scriptHandler {
  add                     lsapi:lsphp php
}
extprocessor lsphp {
  type                    lsapi
  address                 uds://tmp/lshttpd/matrix.sock
  maxConns                10
  env                     PHP_LSAPI_CHILDREN=10
  env                     MATRIX_SITE_URL=http://ols:8088
  env                     MATRIX_TOKEN=@MATRIX_TOKEN@
  initTimeout             60
  retryTimeout            0
  persistConn             1
  respBuffer              0
  autoStart               1
  path                    /usr/local/lsws/lsphp83/bin/lsphp
  backlog                 100
  instances               1
  priority                0
}
rewrite {
  enable                  1
  autoLoadHtaccess        1
}
